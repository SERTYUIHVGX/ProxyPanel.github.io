<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>macOS Sequoia Mobile</title>
    <style>
        :root {
            --mac-shadow: 0 20px 40px rgba(0,0,0,0.4);
            --title-bg: rgba(240, 240, 240, 0.9);
            --glass: rgba(255, 255, 255, 0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            height: 100vh;
            background: #000 url('https://raw.githubusercontent.com/fajarmfth/macos-wallpaper/main/Sequoia/Sequoia%20Dark.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            position: fixed; /* Prevents bounce scrolling on iPad */
            width: 100%;
        }

        /* Menu Bar - Slimmer for iPad */
        .menu-bar {
            height: 26px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            z-index: 10000;
        }

        .menu-left { display: flex; gap: 12px; }
        .menu-right { flex-grow: 1; display: flex; justify-content: flex-end; gap: 12px; }

        /* Window Styling */
        .window {
            position: absolute;
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--mac-shadow);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 0.5px solid rgba(0,0,0,0.2);
            z-index: 100;
            /* Smoother transitions for opening */
            transition: transform 0.2s ease-out, opacity 0.2s;
        }

        .title-bar {
            height: 36px;
            background: var(--title-bg);
            display: flex;
            align-items: center;
            padding: 0 12px;
            flex-shrink: 0;
            touch-action: none; /* Critical for dragging */
        }

        .mac-controls { display: flex; gap: 8px; width: 60px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,0.1); }
        .close { background: #ff5f57; }
        .min { background: #ffbd2e; }
        .max { background: #28c840; }

        .title-text {
            flex-grow: 1;
            text-align: center;
            color: #333;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content { flex-grow: 1; background: #fff; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        /* iPad Optimized Dock */
        .dock-container {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 8px 12px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            z-index: 10001;
        }

        .dock-item {
            width: 50px;
            height: 50px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
        }

        .dock-item:active { transform: scale(0.9); }
        .dock-item img { width: 100%; height: 100%; border-radius: 11px; }

        .active-dot {
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }

        /* Desktop Icon (Single for cleaner look) */
        .desktop-icons {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shortcut {
            width: 70px;
            text-align: center;
            color: white;
            font-size: 11px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .shortcut img { width: 50px; height: 50px; margin-bottom: 4px; }

        /* Fullscreen for iPad */
        .maximized {
            width: 100% !important;
            height: calc(100% - 26px) !important;
            top: 26px !important;
            left: 0 !important;
            border-radius: 0;
        }
    </style>
</head>
<body>

    <div class="menu-bar">
        <div class="menu-left">
            <span style="font-size:16px"></span>
            <strong id="active-app">Safari</strong>
        </div>
        <div class="menu-right">
            <span id="clock">9:41 AM</span>
        </div>
    </div>

    <div class="desktop-icons">
        <div class="shortcut" onclick="openApp('win-safari', 'Safari', 'https://browser.rammerhead.org')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg">
            <div>Safari</div>
        </div>
    </div>

    <!-- Safari Window -->
    <div id="win-safari" class="window" style="width: 90vw; height: 80vh; top: 40px; left: 5vw;">
        <div class="title-bar" id="drag-handle">
            <div class="mac-controls">
                <div class="dot close" onclick="closeApp('win-safari')"></div>
                <div class="dot max" onclick="toggleMax('win-safari')"></div>
            </div>
            <div class="title-text">Rammerhead Browser</div>
        </div>
        <div class="content">
            <iframe id="ifr-safari"></iframe>
        </div>
    </div>

    <!-- Dock -->
    <div class="dock-container">
        <div class="dock-item" onclick="openApp('win-safari', 'Safari', 'https://browser.rammerhead.org')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg">
            <div id="dot-win-safari" class="active-dot"></div>
        </div>
        <div class="dock-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c9/Finder_Icon_macOS_Big_Sur.png">
        </div>
        <div class="dock-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Apple_Notes_icon.png">
        </div>
    </div>

    <script>
        let topZ = 100;
        let activeWin = null;
        let isDragging = false;
        let offset = { x: 0, y: 0 };

        function openApp(id, name, url = null) {
            const win = document.getElementById(id);
            win.style.display = 'flex';
            win.style.opacity = '1';
            document.getElementById('dot-' + id).style.display = 'block';
            if (url) {
                const ifr = win.querySelector('iframe');
                if (!ifr.src) ifr.src = url;
            }
            bringToFront(win, name);
        }

        function closeApp(id) {
            document.getElementById(id).style.display = 'none';
            document.getElementById('dot-' + id).style.display = 'none';
        }

        function toggleMax(id) {
            document.getElementById(id).classList.toggle('maximized');
        }

        function bringToFront(win, name) {
            win.style.zIndex = ++topZ;
            document.getElementById('active-app').innerText = name;
        }

        // dragging logic for Mouse and Touch
        const handle = document.getElementById('drag-handle');
        const win = document.getElementById('win-safari');

        function startDragging(e) {
            if (win.classList.contains('maximized')) return;
            isDragging = true;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            offset.x = clientX - win.offsetLeft;
            offset.y = clientY - win.offsetTop;
            bringToFront(win, 'Safari');
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            win.style.left = (clientX - offset.x) + 'px';
            win.style.top = (clientY - offset.y) + 'px';
        }

        function stopDragging() { isDragging = false; }

        handle.addEventListener('mousedown', startDragging);
        handle.addEventListener('touchstart', startDragging, {passive: false});
        
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: false});
        
        document.addEventListener('mouseup', stopDragging);
        document.addEventListener('touchend', stopDragging);

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
