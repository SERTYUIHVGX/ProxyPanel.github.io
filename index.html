<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AeroOS Mobile</title>
    <style>
        :root {
            --gloss: rgba(255, 255, 255, 0.3);
            --glass: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #0078d7, #83be00, #00d4ff);
            background-image: url('https://images.unsplash.com/photo-1500673922987-e212871fec22?auto=format&fit=crop&q=80&w=2070'); /* Vibrant nature shot */
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The App Container (Iframe) */
        .window {
            display: none;
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 80%;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3), inset 0 0 20px var(--gloss);
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .window-header {
            padding: 10px 20px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            background: rgba(255, 50, 50, 0.7);
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        iframe {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: white;
        }

        /* Floating Dock */
        .dock {
            position: fixed;
            bottom: 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 -3px 5px rgba(0,0,0,0.1);
            font-size: 24px;
            border: 2px solid white;
        }

        .icon:active { transform: scale(0.9); }

        .icon img { width: 40px; height: 40px; }

        /* Floating Bubbles Decoration */
        .bubble {
            position: absolute;
            background: var(--gloss);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-50px) translateX(20px); }
        }
    </style>
</head>
<body>

    <!-- Decorative Bubbles -->
    <div class="bubble" style="width: 100px; height: 100px; top: 10%; left: 15%;"></div>
    <div class="bubble" style="width: 60px; height: 60px; top: 60%; left: 80%;"></div>

    <!-- Rammerhead Window -->
    <div id="rammerhead" class="window">
        <div class="window-header">
            <span>Browser</span>
            <button class="close-btn" onclick="closeApp('rammerhead')">X</button>
        </div>
        <iframe src="https://browser.rammerhead.org"></iframe>
    </div>

    <!-- Snow Rider Window -->
    <div id="snowrider" class="window">
        <div class="window-header">
            <span>Snow Rider 3D</span>
            <button class="close-btn" onclick="closeApp('snowrider')">X</button>
        </div>
        <iframe src="https://itsvijaysingh.github.io/Snow-Rider3D/"></iframe>
    </div>

    <!-- The Dock -->
    <div class="dock">
        <div class="icon" onclick="openApp('rammerhead')" title="Browser">🌐</div>
        <div class="icon" onclick="openApp('snowrider')" title="Snow Rider 3D">🛷</div>
    </div>

    <script>
        function openApp(id) {
            // Close other windows first to keep it clean on iPad
            document.querySelectorAll('.window').forEach(win => win.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function closeApp(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Prevent iPad bounce scrolling
        document.addEventListener('touchmove', function(e) {
            if (e.target.tagName !== 'IFRAME') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
